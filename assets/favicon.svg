<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff00ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f0ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0a0a1a"/>
  <!-- Neon border glow -->
  <rect x="2" y="2" width="28" height="28" rx="5" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.8"/>
  <!-- Tool/Wrench icon -->
  <g filter="url(#glow)" stroke="#00f0ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench body -->
    <path d="M20 8 L14 14 L12 12 L18 6 C18.5 5.5 19.5 5.5 20 6 L26 12 L24 14 L20 8 Z" fill="#0a0a1a"/>
    <!-- Wrench handle -->
    <path d="M12 12 L6 18 C5 19 4 20 4 21 C4 22 5 23 6 23 C7 23 8 22 9 21 L15 15 L12 12 Z" fill="#0a0a1a"/>
    <!-- Gear/bolt accent -->
    <circle cx="20" cy="20" r="3" fill="#ff00ff" stroke="#ff00ff"/>
    <circle cx="20" cy="20" r="1.5" fill="#0a0a1a"/>
  </g>
  <!-- Neon accent dots -->
  <circle cx="8" cy="8" r="1" fill="#ff00ff" opacity="0.9"/>
  <circle cx="24" cy="24" r="1" fill="#00f0ff" opacity="0.9"/>
</svg>